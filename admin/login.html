<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | Linkma</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="card login-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 class="logo">Linkma</h1>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">پنل مدیریت کوتاه‌کننده لینک</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">نام کاربری</label>
          <input type="text" class="input" id="username" name="username" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label for="password">رمز عبور</label>
          <input type="password" class="input" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">ورود</button>
        <div id="errorMsg" style="color: #ef4444; margin-top: 1rem; text-align: center; display: none;"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
          localStorage.setItem('linkma_token', data.data.token);
          localStorage.setItem('linkma_username', data.data.username);
          localStorage.setItem('linkma_role', data.data.role || 'user');
          window.location.href = adminPath('/admin/dashboard.html');
        } else {
          errorMsg.textContent = data.message || 'خطا در ورود';
          errorMsg.style.display = 'block';
        }
      } catch (error) {
        errorMsg.textContent = 'ارتباط با سرور برقرار نشد';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
